<h1>My Anime/Manga Rankings</h1>
<div class="box">
    <p>
        Here I rank the anime & manga that I've completed, I don't seperate
        seasons, I rank by how much I enjoyed each work.
    </p>
</div>
<br />
<table class="anime-table">
    <thead>
        <tr>
            <th width="70px">Ranking</th>
            <th width="100px">Image</th>
            <th width="200px">Title</th>
            <th width="140px">Rank</th>
            <th width="270px">Comments</th>
        </tr>
    </thead>
    <tbody>
        {{ range . }}
        <tr align="center">
            <td>{{ .Rank }}</td>
            <td>
                <img
                    src="{{ .ImageURL }}"
                    alt="{{ .Title }}"
                    style="width: 50px"
                />
            </td>
            <td>{{ .Title }}</td>
            <td>{{ .Tier }}</td>
            <td>{{ .Comments }}</td>
            {{ end }}
        </tr>
    </tbody>
</table>
