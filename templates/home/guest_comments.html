{{ if .Entries }} {{ range .Entries }}
<div class="guestbook-entry">
    <strong>{{ if .Name }}{{ .Name }}{{ else }}Anonymous{{ end }}</strong>
    said:<br />
    <p>{{ .Message }}</p>
    <small><em>at {{ .Timestamp.Format "02/01/2006" }}</em></small
    ><br />
</div>
{{ end }} {{ else }}
<p>No entries yet.</p>
{{ end }}
