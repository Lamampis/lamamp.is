<h2>Latest Posts:</h2>
<div class="box">
    <ul>
        {{ range .Pages }}
        <li>
            <a href="/garden/{{ .Slug }}" class="no_underline"
                >[{{ .Title }}]</a
            >
            <small> {{ .Created.Format "January 02 2006" }} </small>
        </li>

        {{ end }}
    </ul>
    <div style="text-align: right; margin-top: 1em">
        <a href="/garden">View All Posts →</a>
    </div>
</div>
<br />
