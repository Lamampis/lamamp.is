            rel="icon"
            href="/static/images/sm64penguin-min.png"
            type="image/png"
        />
        <link rel="stylesheet" href="/static/css/fonts.css" />
        <script>
            (function () {
                try {
                    // Get stored theme
                    var theme = localStorage.getItem("theme");

                    if (!theme) {
                        theme = window.matchMedia(
                            "(prefers-color-scheme: dark)",
                        ).matches
                            ? "dark"
                            : "light";
                    }

                    // Apply theme BEFORE page paints
                    document.documentElement.classList.add(theme);
                } catch (e) {}
            })();
        </script>

        <script defer src="/static/trail.js"></script>
        <script
            async
            src="https://cloud.umami.is/script.js"
            data-website-id="c73635f3-7ec6-42d7-8bd4-8dc95c8cf6dc"
        ></script>

        <script defer src="/static/theme-switcher.js"></script>

        <link
            rel="stylesheet"
            id="theme-fallback"
            href="/static/style-dark.css"
        />

        <script>
            (function () {
                const saved = localStorage.getItem("theme");
                const prefersLight = window.matchMedia(
                    "(prefers-color-scheme: light)",
                ).matches;
                const useLight = saved === "light" || (!saved && prefersLight);

                const fallback = document.getElementById("theme-fallback");
                if (fallback) fallback.remove();

                const css = document.createElement("link");
                css.rel = "stylesheet";
                css.id = useLight ? "light-theme" : "dark-theme";
                css.href = useLight
                    ? "/static/style-light.css"
                    : "/static/style-dark.css";
                document.head.appendChild(css);

                document.documentElement.classList.add(
                    useLight ? "light" : "dark",
                );
            })();
        </script>
    </head>
